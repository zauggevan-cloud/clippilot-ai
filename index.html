<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipPilot AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #100d25, #25104a, #10152f);
      padding: 35px 16px;
    }

    .container {
      max-width: 750px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 8px;
      color: #bd8cff;
    }

    .subtitle {
      color: #c8bddf;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #75629d;
      background: #17132b;
      color: white;
      font-size: 15px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 9px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
    }

    #generateBtn {
      width: 100%;
      margin-top: 25px;
      color: white;
      background: linear-gradient(90deg, #783cf5, #bd65ff);
    }

    #generateBtn:hover {
      opacity: 0.88;
    }

    #result {
      display: none;
      white-space: pre-wrap;
      line-height: 1.7;
      color: #eee5ff;
      margin-top: 15px;
    }

    #copyBtn {
      display: none;
      margin-top: 15px;
      color: white;
      background: #493477;
    }

    .language {
      text-align: right;
      margin-bottom: 15px;
    }

    .language button {
      background: transparent;
      color: white;
      padding: 7px 10px;
    }

    footer {
      text-align: center;
      color: #a99cbd;
      font-size: 13px;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="language">
      <button id="frBtn">🇫🇷 Français</button>
      <button id="enBtn">🇬🇧 English</button>
    </div>

    <header>
      <h1>ClipPilot AI 🚀</h1>
      <p class="subtitle" id="subtitle">
        Crée du contenu pour tes réseaux sociaux en quelques secondes.
      </p>
    </header>

    <section class="card">
      <label for="topic" id="topicLabel">Quel est le sujet de ta vidéo ?</label>
      <input id="topic" type="text" placeholder="Exemple : Minecraft, football, gaming...">

      <label for="platform" id="platformLabel">Plateforme</label>
      <select id="platform">
        <option value="TikTok">TikTok</option>
        <option value="YouTube">YouTube</option>
        <option value="Instagram">Instagram</option>
      </select>

      <label for="type" id="typeLabel">Type de contenu</label>
      <select id="type">
        <option value="Idée de vidéo">Idée de vidéo</option>
        <option value="Script">Script</option>
        <option value="Titre et description">Titre et description</option>
        <option value="Hashtags">Hashtags</option>
      </select>

      <button id="generateBtn">✨ Générer mon contenu</button>
    </section>

    <section class="card">
      <h2 id="resultTitle">Ton résultat</h2>
      <div id="result"></div>
      <button id="copyBtn">📋 Copier le résultat</button>
    </section>

    <footer>
      ClipPilot AI – Ton assistant de création de contenu
    </footer>

  </main>

  <script>
    const topicInput = document.getElementById("topic");
    const platformInput = document.getElementById("platform");
    const typeInput = document.getElementById("type");
    const generateBtn = document.getElementById("generateBtn");
    const result = document.getElementById("result");
    const copyBtn = document.getElementById("copyBtn");

    let language = "fr";
    let generatedText = "";

    function generate() {
      const topic = topicInput.value.trim();
      const platform = platformInput.value;
      const type = typeInput.value;

      if (!topic) {
        alert(language === "fr"
          ? "Écris d'abord le sujet de ta vidéo !"
          : "Enter your video topic first!");
        topicInput.focus();
        return;
      }

      let content = "";

      if (language === "fr") {
        if (type === "Idée de vidéo") {
          content =
            "🎬 IDÉE DE VIDÉO\n\n" +
            "Sujet : " + topic + "\n\n" +
            "Concept : réalise une vidéo originale sur " + topic +
            " avec un début accrocheur, un moment surprenant et une conclusion qui donne envie de réagir.\n\n" +
            "💡 Conseil : commence directement par le moment le plus intéressant !";
        }

        if (type === "Script") {
          content =
            "🎤 SCRIPT\n\n" +
            "INTRODUCTION :\n" +
            "« Salut tout le monde ! Aujourd'hui, on se retrouve pour parler de " +
            topic + " ! »\n\n" +
            "DÉVELOPPEMENT :\n" +
            "Présente ton sujet, partage tes idées et ajoute un moment surprenant pour retenir l'attention.\n\n" +
            "CONCLUSION :\n" +
            "« Dites-moi ce que vous en pensez en commentaire et à très bientôt ! »";
        }

        if (type === "Titre et description") {
          content =
            "📌 TITRE :\n" +
            topic + " : vous n'allez pas y croire !\n\n" +
            "📝 DESCRIPTION :\n" +
            "Bienvenue dans cette nouvelle vidéo consacrée à " + topic +
            " ! Découvre notre contenu et partage ton avis en commentaire.\n\n" +
            "Abonne-toi pour ne rien manquer !";
        }

        if (type === "Hashtags") {
          const cleanTopic = topic.toLowerCase().replace(/\s+/g, "");
          content =
            "🔖 HASHTAGS :\n\n" +
            "# " + cleanTopic + "\n" +
            "#gaming\n#video\n#youtube\n#tiktok\n#instagram\n#creator\n#decouverte";
        }
      } else {
        if (type === "Idée de vidéo") {
          content =
            "🎬 VIDEO IDEA\n\n" +
            "Topic: " + topic + "\n\n" +
            "Concept: Create an original video about " + topic +
            " with a strong opening, a surprising moment and an engaging ending.";
        }

        if (type === "Script") {
          content =
            "🎤 SCRIPT\n\n" +
            "INTRO:\n" +
            '"Hey everyone! Welcome back! Today we are talking about ' +
            topic + '!"\n\n' +
            "MAIN PART:\n" +
            "Present your topic, share your ideas and add a surprising moment.\n\n" +
            "ENDING:\n" +
            '"Tell us what you think in the comments. See you soon!"';
        }

        if (type === "Titre et description") {
          content =
            "📌 TITLE:\n" +
            topic + " – You won't believe this!\n\n" +
            "📝 DESCRIPTION:\n" +
            "Welcome to our new video about " + topic +
            "! Share your opinion in the comments and subscribe for more.";
        }

        if (type === "Hashtags") {
          const cleanTopic = topic.toLowerCase().replace(/\s+/g, "");
          content =
            "🔖 HASHTAGS:\n\n" +
            "#" + cleanTopic +
            "\n#gaming\n#video\n#youtube\n#tiktok\n#instagram\n#creator";
        }
      }

      generatedText = content;
      result.textContent = content;
      result.style.display = "block";
      copyBtn.style.display = "inline-block";
    }

    function copyResult() {
      if (!generatedText) return;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(generatedText)
          .then(() => alert(language === "fr"
            ? "Résultat copié !"
            : "Result copied!"))
          .catch(() => fallbackCopy());
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      const temporary = document.createElement("textarea");
      temporary.value = generatedText;
      document.body.appendChild(temporary);
      temporary.select();
      document.execCommand("copy");
      temporary.remove();
      alert(language === "fr" ? "Résultat copié !" : "Result copied!");
    }

    function changeLanguage(lang) {
      language = lang;

      document.documentElement.lang = lang;

      document.getElementById("subtitle").textContent =
        lang === "fr"
          ? "Crée du contenu pour tes réseaux sociaux en quelques secondes."
          : "Create social media content in seconds.";

      document.getElementById("topicLabel").textContent =
        lang === "fr" ? "Quel est le sujet de ta vidéo ?" : "What is your video topic?";

      topicInput.placeholder =
        lang === "fr" ? "Exemple : Minecraft, football, gaming..." : "Example: Minecraft, football, gaming...";

      document.getElementById("platformLabel").textContent =
        lang === "fr" ? "Plateforme" : "Platform";

      document.getElementById("typeLabel").textContent =
        lang === "fr" ? "Type de contenu" : "Content type";

      document.getElementById("resultTitle").textContent =
        lang === "fr" ? "Ton résultat" : "Your result";

      generateBtn.textContent =
        lang === "fr" ? "✨ Générer mon contenu" : "✨ Generate my content";

      copyBtn.textContent =
        lang === "fr" ? "📋 Copier le résultat" : "📋 Copy result";

      const types = lang === "fr"
        ? ["Idée de vidéo", "Script", "Titre et description", "Hashtags"]
        : ["Video idea", "Script", "Title and description", "Hashtags"];

      typeInput.innerHTML = "";
      types.forEach((name, index) => {
        const option = document.createElement("option");
        option.value = [
          "Idée de vidéo",
          "Script",
          "Titre et description",
          "Hashtags"
        ][index];
        option.textContent = name;
        typeInput.appendChild(option);
      });
    }

    // Ces événements relient les boutons à leurs fonctions.
    generateBtn.addEventListener("click", generate);
    copyBtn.addEventListener("click", copyResult);

    document.getElementById("frBtn").addEventListener("click", () => {
      changeLanguage("fr");
    });

    document.getElementById("enBtn").addEventListener("click", () => {
      changeLanguage("en");
    });
  </script>
</body>
</html>
